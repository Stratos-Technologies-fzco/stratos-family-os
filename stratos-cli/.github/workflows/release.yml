name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the tag matches the package version
        run: |
          version=$(python - <<'PY'
          import tomllib
          print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])
          PY
          )
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: |
          python -m pip install --upgrade pip build cyclonedx-bom
          python -m build
          python -m pip install -e ".[openai,pdf]"
          python -m cyclonedx_py environment --output-format JSON --output-file dist/sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    name: Sign and publish the GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # keyless signing (Sigstore)
      attestations: write # build provenance
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Attest build provenance (signed)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  pypi:
    name: Publish to PyPI (trusted publishing)
    # Enabled only when the repository variable PUBLISH_TO_PYPI is set to "true".
    if: vars.PUBLISH_TO_PYPI == 'true'
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Remove the SBOM (not a distribution file)
        run: rm -f dist/sbom.cdx.json
      - uses: pypa/gh-action-pypi-publish@release/v1
