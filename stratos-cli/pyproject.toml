[project]
name = "stratos-cli"
version = "0.1.0"
description = "Stratos Enterprise Developer Platform CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6",
    "platformdirs>=4",
    "httpx>=0.27",
    "keyring>=25",
]

[project.scripts]
stratos = "stratos.cli.app:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stratos"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # typer.Option in defaults is the Typer idiom

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["stratos"]
